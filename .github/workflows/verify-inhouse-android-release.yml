name: Verify Inhouse Android release

on:
  # The manifest is committed before the release asset exists. Checking on
  # that push creates a predictable 404 and sends a false failure email.
  # A published Android release is the first point when the URL is verifiable.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'v') && !contains(github.event.release.tag_name, 'ios'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test preflight logic
        run: python -m unittest discover -s .github/scripts -p 'test_verify_android_release.py'
      - name: Check published release and actual download URL
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify_android_release.py
