<!doctype html>
<html class="dark">
  <head>
    <!-- (used for SSR) -->
    <!-- metadata:tags -->

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Inhouse Photos" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/inhouse-photos-mark.svg?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/inhouse-pwa-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/inhouse-pwa-180.png" />
    <link rel="preload" as="font" type="font/ttf" href="%app.font%" crossorigin="anonymous" />
    <link rel="preload" as="font" type="font/ttf" href="%app.monofont%" crossorigin="anonymous" />

    <script>
      try {
        const preference = JSON.parse(localStorage.getItem('immich-ui-theme'));
        const prefersDark = globalThis.matchMedia('(prefers-color-scheme: dark)').matches;
        if (preference === 'light' || (preference !== 'dark' && !prefersDark)) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch {
        // noop
      }
    </script>

    %sveltekit.head%

    <style>
      html {
        width: 100%;
        min-height: 100%;
        background: #120c08;
      }

      html.light {
        background: #faf8f5;
      }

      body,
      html {
        margin: 0;
        padding: 0;
      }

      @keyframes reveal-stencil {
        to {
          opacity: 1;
        }
      }

      #stencil {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        place-items: center;
        background: inherit;
        opacity: 0;
        pointer-events: none;
        animation: reveal-stencil 180ms ease 280ms forwards;
      }

      #stencil img {
        width: 84px;
        height: 84px;
      }

      @media (prefers-reduced-motion: reduce) {
        #stencil {
          animation-duration: 0ms;
        }
      }
    </style>
    <link rel="stylesheet" href="/custom.css" />
  </head>

  <noscript style="position: absolute; inset: 0; z-index: 1000; padding: 2rem; color: #231913; background: #faf8f5">
    Inhouse Photos needs JavaScript enabled in your browser.
  </noscript>

  <body class="bg-light text-dark">
    <div id="stencil" aria-label="Loading Inhouse Photos">
      <img src="/inhouse-photos-mark.svg" alt="" />
    </div>
    <div>%sveltekit.body%</div>
  </body>
</html>
