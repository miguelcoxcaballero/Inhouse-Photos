name: Build Inhouse Photos Android OTA Base

on:
  push:
    branches:
      - 'ota-base-*'
  workflow_dispatch:

concurrency:
  group: inhouse-shorebird-android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build OTA-enabled APK in GitHub Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install Shorebird
        run: |
          SHOREBIRD_HOME="${XDG_CONFIG_HOME:-$HOME/.shorebird}"
          if [[ -n "${XDG_CONFIG_HOME:-}" ]]; then
            SHOREBIRD_HOME="$XDG_CONFIG_HOME/shorebird"
          fi
          curl --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh \
            -sSf | bash -s -- --force
          echo "$SHOREBIRD_HOME/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Generate translations
        run: mise //mobile:codegen:translation

      - name: Generate platform APIs
        working-directory: ./mobile
        run: |
          for schema in pigeon/*.dart; do
            dart run pigeon --input "$schema"
          done
          dart format lib/platform/
          mv android/app/src/main/kotlin/app/alextran/immich/background/BackgroundWorker.g.kt android/app/src/main/kotlin/app/alextran/immich/background/BackgroundWorker.pigeon.kt
          mv android/app/src/main/kotlin/app/alextran/immich/background/BackgroundWorkerLock.g.kt android/app/src/main/kotlin/app/alextran/immich/background/BackgroundWorkerLock.pigeon.kt
          mv android/app/src/main/kotlin/app/alextran/immich/connectivity/Connectivity.g.kt android/app/src/main/kotlin/app/alextran/immich/connectivity/Connectivity.pigeon.kt
          mv android/app/src/main/kotlin/app/alextran/immich/core/Network.g.kt android/app/src/main/kotlin/app/alextran/immich/core/Network.pigeon.kt
          mv android/app/src/main/kotlin/app/alextran/immich/images/LocalImages.g.kt android/app/src/main/kotlin/app/alextran/immich/images/LocalImages.pigeon.kt
          mv android/app/src/main/kotlin/app/alextran/immich/images/RemoteImages.g.kt android/app/src/main/kotlin/app/alextran/immich/images/RemoteImages.pigeon.kt
          mv android/app/src/main/kotlin/app/alextran/immich/permission/PermissionApi.g.kt android/app/src/main/kotlin/app/alextran/immich/permission/PermissionApi.pigeon.kt
          mv android/app/src/main/kotlin/app/alextran/immich/sync/Messages.g.kt android/app/src/main/kotlin/app/alextran/immich/sync/Messages.pigeon.kt
          mv android/app/src/main/kotlin/app/alextran/immich/viewintent/ViewIntent.g.kt android/app/src/main/kotlin/app/alextran/immich/viewintent/ViewIntent.pigeon.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/background/BackgroundWorker.pigeon.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/connectivity/Connectivity.pigeon.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/core/Network.pigeon.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/images/LocalImages.pigeon.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/permission/PermissionApi.pigeon.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/sync/Messages.pigeon.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/viewintent/ViewIntent.pigeon.kt

      - name: Create Shorebird release and signed APK
        working-directory: ./mobile
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: >-
          shorebird release android
          --artifact apk
          --flutter-version 3.44.8
          --build-name 3.1.37
          --build-number 5096
          --target-platform android-arm64

      - name: Stage APK for download
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk Inhouse-Photos.apk
          sha256sum Inhouse-Photos.apk > Inhouse-Photos.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Inhouse-Photos-3.1.37-OTA
          path: |
            Inhouse-Photos.apk
            Inhouse-Photos.apk.sha256
          if-no-files-found: error
