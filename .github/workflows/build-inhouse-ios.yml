name: Build Inhouse Photos iOS (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-inhouse-ios.*'

permissions:
  contents: read

concurrency:
  group: inhouse-ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned IPA for SideStore
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Set up Mise and Flutter
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Generate translations
        run: mise //mobile:codegen:translation

      - name: Generate platform APIs
        run: mise //mobile:codegen:pigeon

      - name: Build iOS app without signing
        id: build_ios
        shell: bash
        run: |
          set -o pipefail
          cd mobile
          flutter build ios --release --no-codesign 2>&1 | tee ../ios-build.log

      - name: Surface iOS compiler errors
        if: failure() && steps.build_ios.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          errors="$(grep -E '(^|[[:space:]])error:|Swift Compiler Error|Could not build' ios-build.log | tail -40 || true)"
          if [[ -z "$errors" ]]; then
            errors="$(tail -80 ios-build.log)"
          fi
          while IFS= read -r line; do
            escaped="${line//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error title=iOS compiler::$escaped"
          done <<< "$errors"

      - name: Upload iOS build log
        if: failure() && steps.build_ios.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Inhouse-Photos-iOS-build-log
          path: ios-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find mobile/build/ios/iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$app_path"
          mkdir -p mobile/build/ios/unsigned/Payload
          ditto "$app_path" mobile/build/ios/unsigned/Payload/"$(basename "$app_path")"
          cd mobile/build/ios/unsigned
          zip -qry ../Inhouse-Photos.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Inhouse-Photos-iOS-unsigned
          path: mobile/build/ios/Inhouse-Photos.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged IPA release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' mobile/pubspec.yaml)"
          digest="$(shasum -a 256 mobile/build/ios/Inhouse-Photos.ipa | awk '{print toupper($1)}')"
          notes="$(printf '%s\n\n%s\n\n%s' \
            "Unsigned Inhouse Photos iOS ${version} build for SideStore or AltStore." \
            "A free Apple Account signs the app for seven days at a time; SideStore can refresh it on the iPhone." \
            "SHA-256: ${digest}")"
          gh release create "$GITHUB_REF_NAME" mobile/build/ios/Inhouse-Photos.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "Inhouse Photos for iOS ${version}" \
            --notes "$notes" \
            --prerelease
