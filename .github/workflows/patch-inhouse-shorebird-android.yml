name: Publish Inhouse Photos Android OTA Patch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Shorebird release to patch
        required: true
        default: '3.1.37+5096'

concurrency:
  group: inhouse-shorebird-android-patch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  patch:
    name: Compile and publish Dart patch in GitHub Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Mise
        uses: immich-app/devtools/actions/use-mise@3bca63ca3c15020293b36b51737a3ee2c773340b # use-mise-action-v3.1.0
        with:
          github_token: ${{ github.token }}
          working_directory: ./mobile

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: ''

      - name: Install Shorebird
        run: |
          SHOREBIRD_HOME="${XDG_CONFIG_HOME:-$HOME/.shorebird}"
          if [[ -n "${XDG_CONFIG_HOME:-}" ]]; then
            SHOREBIRD_HOME="$XDG_CONFIG_HOME/shorebird"
          fi
          curl --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh \
            -sSf | bash -s -- --force
          echo "$SHOREBIRD_HOME/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: mise //mobile:install:ci

      - name: Generate translations
        run: mise //mobile:codegen:translation

      - name: Generate platform APIs
        working-directory: ./mobile
        run: |
          for schema in pigeon/*.dart; do
            dart run pigeon --input "$schema"
          done
          dart format lib/platform/
          test -s android/app/src/main/kotlin/app/alextran/immich/background/BackgroundWorker.g.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/connectivity/Connectivity.g.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/core/Network.g.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/images/LocalImages.g.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/permission/PermissionApi.g.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/sync/Messages.g.kt
          test -s android/app/src/main/kotlin/app/alextran/immich/viewintent/ViewIntent.g.kt
          if grep -R "^package app.alextran.immich" android/app/src/main/kotlin --include='*.g.kt'; then
            echo "Generated Kotlin still uses the upstream package" >&2
            exit 1
          fi

      - name: Publish patch
        working-directory: ./mobile
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: >-
          shorebird patch android
          --release-version "${{ inputs.release_version }}"
          --build-name 3.1.37
          --build-number 5096
          --allow-asset-diffs
