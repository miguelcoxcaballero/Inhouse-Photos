name: Publish verified Inhouse Windows manager

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inhouse-windows-publication
  cancel-in-progress: false

env:
  WINDOWS_VERSION: '3.1.99'
  WINDOWS_TAG: server-v3.1.99
  RUNTIME_VERSION: '3.1.97'
  RUNTIME_TAG: server-runtime-v3.1.97-r2
  RUNTIME_PACKAGE: Inhouse-Photos-Server-Runtime-3.1.97.zip
  RUNTIME_SHA256: adee8af6a06023ccaca589c39ef68b7b356ab1f70c618e41757479f88f368b15

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout the Windows source to publish
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Preserve an already published manager release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previousErrorPreference = $ErrorActionPreference
          try {
            # PowerShell 5.1 turns redirected native stderr into errors even for
            # the expected "release not found" result on the first publication.
            $ErrorActionPreference = 'Continue'
            $result = gh release view $env:WINDOWS_TAG --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
            $releaseExitCode = $LASTEXITCODE
          } finally { $ErrorActionPreference = $previousErrorPreference }
          if ($releaseExitCode -eq 0 -and -not ($result | ConvertFrom-Json).isDraft) {
            'published=true' >> $env:GITHUB_OUTPUT
            Write-Output 'This immutable manager release is already published; no assets will be replaced.'
          } else { 'published=false' >> $env:GITHUB_OUTPUT }
          $global:LASTEXITCODE = 0

      - name: Verify publication staging preserves concurrent Android changes
        if: steps.existing.outputs.published != 'true'
        run: |
          python -m unittest discover -s .github/scripts -p test_prepare_windows_publication.py
          if ($LASTEXITCODE -ne 0) { throw 'Windows publication staging tests failed' }
          node --test portal/downloads.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Full-installer download catalog tests failed' }

      - name: Build the manager and embedded installer payload
        if: steps.existing.outputs.published != 'true'
        run: |
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout is not clean' }
          & .\desktop\build.ps1

      - name: Download the exact verified server runtime for the full installer
        if: steps.existing.outputs.published != 'true'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runtimeDirectory = Join-Path $env:RUNNER_TEMP 'pinned-windows-runtime'
          New-Item -ItemType Directory -Path $runtimeDirectory -Force | Out-Null
          gh release download $env:RUNTIME_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:RUNTIME_PACKAGE --dir $runtimeDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the pinned server runtime' }
          $runtimePackage = Join-Path $runtimeDirectory $env:RUNTIME_PACKAGE
          $actual = (Get-FileHash -LiteralPath $runtimePackage -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:RUNTIME_SHA256) { throw 'Pinned server runtime checksum mismatch; no installer will be published' }

      - name: Package the complete Windows product without changing the compact updater
        if: steps.existing.outputs.published != 'true'
        run: |
          & .\desktop\package-full-installer.ps1 -RuntimePackage (Join-Path (Join-Path $env:RUNNER_TEMP 'pinned-windows-runtime') $env:RUNTIME_PACKAGE) -CompactInstaller .\desktop\dist\Inhouse-Photos-Server-Setup.exe -OutFile .\desktop\dist\Inhouse-Photos-Server-Full-Setup.exe
          $global:LASTEXITCODE = 0

      - name: Verify the embedded updater with Windows PowerShell 5.1
        if: steps.existing.outputs.published != 'true'
        run: |
          & .\desktop\server-runtime-update.tests.ps1
          # This PowerShell script throws on failed checks; it does not set a
          # native exit code. Clear it only after successful script completion.
          $global:LASTEXITCODE = 0
          & .\desktop\server-runtime-update.transaction.tests.ps1
          $global:LASTEXITCODE = 0

      - name: Verify durable updates, exited installers, inherited pipes and public downloads
        if: steps.existing.outputs.published != 'true'
        shell: pwsh
        run: |
          $global:LASTEXITCODE = 0
          & .\desktop\system-update.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'System update coordinator verification failed' }
          $global:LASTEXITCODE = 0
          & .\desktop\manager-update.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Manager handoff verification failed' }
          $global:LASTEXITCODE = 0
          & .\desktop\runtime-process-output.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Runtime output deadline verification failed' }
          $global:LASTEXITCODE = 0
          & .\desktop\public-downloads.tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Public download publication verification failed' }
          $global:LASTEXITCODE = 0
          & .\desktop\full-installer-package.tests.ps1 -FullInstaller .\desktop\dist\Inhouse-Photos-Server-Full-Setup.exe -CompactInstaller .\desktop\dist\Inhouse-Photos-Server-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Full-installer package and isolated lease verification failed' }
          $global:LASTEXITCODE = 0

      - name: Download verified 3.1.96, 1.2.17 and 1.2.16 upgrade fixtures
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fixtures = @(
            @{ version = '1.2.17'; sha256 = 'd6eb4b2ce1331f32688f48ab87f649285a84fbe6996b6e8e1c96cb3af12e5981' },
            @{ version = '1.2.16'; sha256 = '9378c9b3cc1366699011b29d5a06c32451a417b6fd0ba2574981c329844be65d' },
            @{ version = '3.1.96'; sha256 = '1857acdac75128fc79ab0b2628b704700beaf8dd8117936ba04ace90d8e2b016' }
          )
          foreach ($fixture in $fixtures) {
            $directory = "$env:RUNNER_TEMP\previous-manager-$($fixture.version)"
            New-Item -ItemType Directory -Path $directory -Force | Out-Null
            gh release download "server-v$($fixture.version)" --repo $env:GITHUB_REPOSITORY --pattern Inhouse-Photos-Server-Setup.exe --dir $directory
            if ($LASTEXITCODE -ne 0) { throw "Could not download the public $($fixture.version) installer" }
            $actual = (Get-FileHash "$directory\Inhouse-Photos-Server-Setup.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $fixture.sha256) { throw "Installer $($fixture.version) checksum mismatch" }
          }

      - name: Verify the unified version, embedded downloads and all three installed upgrade paths
        if: steps.existing.outputs.published != 'true'
        run: |
          & .\desktop\verify-windows-release.ps1 -Version $env:WINDOWS_VERSION -PinnedRuntimeVersion $env:RUNTIME_VERSION -FullInstallerPath .\desktop\dist\Inhouse-Photos-Server-Full-Setup.exe -SourceCommit $env:GITHUB_SHA -PreviousInstallerPath "$env:RUNNER_TEMP\previous-manager-1.2.17\Inhouse-Photos-Server-Setup.exe" -BootstrapInstallerPath "$env:RUNNER_TEMP\previous-manager-1.2.16\Inhouse-Photos-Server-Setup.exe" -PreviousProductInstallerPath "$env:RUNNER_TEMP\previous-manager-3.1.96\Inhouse-Photos-Server-Setup.exe"

      - name: Save the verified Windows manifest and test report
        if: steps.existing.outputs.published != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: inhouse-windows-release-verification
          path: |
            windows-server-update.json
            desktop/dist/windows-release-verification.json
            desktop/dist/SHA256SUMS.txt
            desktop/dist/public-downloads.zip
          if-no-files-found: error

      - name: Upload and verify the immutable public installer
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previousErrorPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = 'Continue'
            $draft = gh release view $env:WINDOWS_TAG --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
            $releaseExitCode = $LASTEXITCODE
          } finally { $ErrorActionPreference = $previousErrorPreference }
          if ($releaseExitCode -eq 0) {
            if (-not ($draft | ConvertFrom-Json).isDraft) { throw 'Refusing to overwrite a published Windows release' }
          } else {
            gh release create $env:WINDOWS_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Inhouse Photos $env:WINDOWS_VERSION para Windows" --draft --notes-file desktop/RELEASE-3.1.99.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release draft' }
          }
          gh release upload $env:WINDOWS_TAG --repo $env:GITHUB_REPOSITORY --clobber desktop/dist/Inhouse-Photos-Server-Setup.exe desktop/dist/Inhouse-Photos-Server-Full-Setup.exe desktop/dist/Inhouse-Photos-Server.exe desktop/dist/SHA256SUMS.txt desktop/dist/windows-release-verification.json windows-server-update.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the verified Windows assets' }
          $downloads = "$env:RUNNER_TEMP\downloaded-windows-release"
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null
          gh release download $env:WINDOWS_TAG --repo $env:GITHUB_REPOSITORY --dir $downloads
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the uploaded Windows assets' }
          foreach ($name in @('Inhouse-Photos-Server-Setup.exe', 'Inhouse-Photos-Server-Full-Setup.exe', 'Inhouse-Photos-Server.exe', 'SHA256SUMS.txt', 'windows-release-verification.json')) {
            if ((Get-FileHash "desktop/dist/$name" -Algorithm SHA256).Hash -ne (Get-FileHash "$downloads/$name" -Algorithm SHA256).Hash) { throw "Published asset hash mismatch: $name" }
          }
          if ((Get-FileHash windows-server-update.json -Algorithm SHA256).Hash -ne (Get-FileHash "$downloads/windows-server-update.json" -Algorithm SHA256).Hash) { throw 'Published Windows manifest hash mismatch' }
          foreach ($installer in @(
            @{ Name = 'Inhouse-Photos-Server-Setup.exe'; Arguments = '--verify-payload'; TimeoutMs = 30000 },
            @{ Name = 'Inhouse-Photos-Server-Full-Setup.exe'; Arguments = '--verify-full-package'; TimeoutMs = 180000 }
          )) {
            $info = New-Object Diagnostics.ProcessStartInfo
            $info.FileName = Join-Path $downloads $installer.Name
            $info.Arguments = $installer.Arguments
            $info.UseShellExecute = $false
            $info.CreateNoWindow = $true
            $info.WindowStyle = 'Hidden'
            $check = [Diagnostics.Process]::Start($info)
            try {
              if (-not $check.WaitForExit($installer.TimeoutMs)) { $check.Kill(); throw "Downloaded installer verification timed out: $($installer.Name)" }
              if ($check.ExitCode -ne 0) { throw "Downloaded installer payload verification failed: $($installer.Name)" }
            } finally { $check.Dispose() }
          }
          gh release edit $env:WINDOWS_TAG --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified Windows release' }

      - name: Verify the public download URLs without authentication
        if: steps.existing.outputs.published != 'true'
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $public = "$env:RUNNER_TEMP\public-windows-release"
          New-Item -ItemType Directory -Path $public -Force | Out-Null
          foreach ($name in @('Inhouse-Photos-Server-Setup.exe', 'Inhouse-Photos-Server-Full-Setup.exe', 'Inhouse-Photos-Server.exe', 'SHA256SUMS.txt', 'windows-release-verification.json', 'windows-server-update.json')) {
            $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:WINDOWS_TAG/$name"
            $downloaded = Join-Path $public $name
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try { Invoke-WebRequest -Uri $url -OutFile $downloaded -UseBasicParsing -TimeoutSec 900; break }
              catch { if ($attempt -eq 3) { throw }; Start-Sleep -Seconds 3 }
            }
            $original = if ($name -eq 'windows-server-update.json') { $name } else { "desktop/dist/$name" }
            if ((Get-FileHash $original -Algorithm SHA256).Hash -ne (Get-FileHash $downloaded -Algorithm SHA256).Hash) { throw "Public Windows download mismatch: $name" }
          }

      - name: Commit only the verified Windows manifest on the latest main branch
        if: steps.existing.outputs.published != 'true'
        run: |
          git fetch --depth=2 --no-tags origin $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the latest source branch' }
          $latest = (git rev-parse FETCH_HEAD).Trim()
          $staging = "$env:RUNNER_TEMP\windows-publication"
          python .github/scripts/prepare_windows_publication.py --source $env:GITHUB_SHA --target $latest --directory $staging
          if ($LASTEXITCODE -ne 0) { throw 'Windows inputs changed; the published manifest was not committed' }
          Push-Location $staging
          try {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- windows-server-update.json
            git commit -m "chore(windows): publish verified manager $env:WINDOWS_VERSION manifest"
            if ($LASTEXITCODE -ne 0) { throw 'Could not commit the verified Windows manifest' }
            git push origin "HEAD:refs/heads/$env:GITHUB_REF_NAME"
            if ($LASTEXITCODE -ne 0) { throw 'The branch advanced concurrently; no source changes were overwritten' }
          } finally { Pop-Location }
