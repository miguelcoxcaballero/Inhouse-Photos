name: Verify Inhouse Android release

on:
  push:
    branches: [main]
    paths:
      - android-update.json
      - .github/scripts/verify_android_release.py
      - .github/scripts/test_verify_android_release.py
      - .github/workflows/verify-inhouse-android-release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Test preflight logic
        run: python -m unittest discover -s .github/scripts -p 'test_verify_android_release.py'
      - name: Check published release and actual download URL
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify_android_release.py
