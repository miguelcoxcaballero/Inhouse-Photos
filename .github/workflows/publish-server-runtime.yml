name: Publish optimized Inhouse server runtime

on:
  workflow_dispatch:
  push:
    branches: [perf/storage-saver-throughput]
    paths:
      - '.github/workflows/publish-server-runtime.yml'
      - 'desktop/*server-runtime*'
      - 'desktop/SERVER-RUNTIME-UPDATES.md'
      - 'server/bin/start.sh'
      - 'server/src/**'
      - 'server/test/benchmarks/**'

concurrency:
  group: inhouse-server-runtime-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  RUNTIME_VERSION: 3.1.0-storage-saver-20261002
  RUNTIME_TAG: server-runtime-v3.1.0-storage-saver-20261002

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
      - name: Build the changed runtime modules
        run: |
          npm install --global pnpm@11.13.1
          pnpm --filter immich... --filter @immich/sdk... install --frozen-lockfile
          pnpm --filter @immich/sdk --filter @immich/plugin-sdk --filter immich build
          node --test desktop/server-runtime-queue-handoff.test.cjs
          pwsh -NoProfile -File desktop/server-runtime-update.tests.ps1
          bash -n server/bin/start.sh
      - name: Build and load the verified server image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .runtime/release .runtime/validation .runtime/performance
          gh release download server-v1.2.5 --repo "$GITHUB_REPOSITORY" --pattern inhouse-server-3.1.0-pairing-20260929.tar.gz --dir .runtime
          python3 desktop/build-server-runtime.py .runtime/inhouse-server-3.1.0-pairing-20260929.tar.gz server/dist .runtime/release --source-commit "$GITHUB_SHA" --version "$RUNTIME_VERSION" --image "inhouse-photos-server:v$RUNTIME_VERSION"
          docker load --input ".runtime/release/inhouse-server-$RUNTIME_VERSION.tar.gz"
          git fetch --depth=1 origin 67b8d77eb710211b13dc7a7ef469054b98962657
          cp server/test/benchmarks/storage-saver.cjs .runtime/validation/benchmark.cjs
          cd server
          node <<'JS'
          const {execFileSync}=require('node:child_process');
          const fs=require('node:fs');
          const swc=require('@swc/core');
          const source=execFileSync('git',['show','67b8d77eb710211b13dc7a7ef469054b98962657:server/src/repositories/media.repository.ts'],{encoding:'utf8'}).replaceAll(/from 'src\/([^']+)'/g,(_,name)=>`from '/usr/src/app/server/dist/${name}'`);
          const {code}=swc.transformSync(source,{jsc:{parser:{syntax:'typescript',decorators:true},transform:{legacyDecorator:true,decoratorMetadata:true},target:'es2022'},module:{type:'commonjs'}});
          fs.writeFileSync('../.runtime/validation/baseline-media.repository.cjs',code);
          JS
      - name: Measure the published image
        run: |
          docker run --rm --network none --env NODE_PATH=/usr/src/app/server/node_modules --env BENCHMARK_SERVER_ROOT=/usr/src/app/server --env BENCHMARK_BASELINE_MODULE=/validation/baseline-media.repository.cjs --mount "type=bind,source=$PWD/.runtime/validation,target=/validation,readonly" --mount "type=bind,source=$PWD/.runtime/performance,target=/results" --entrypoint node "inhouse-photos-server:v$RUNTIME_VERSION" /validation/benchmark.cjs /results
      - name: Verify startup, API uploads and existing queue backlog
        env:
          RUNTIME_TEST_COMPOSE: ${{ github.workspace }}/server/test/benchmarks/runtime-smoke.compose.yml
          RUNTIME_TEST_FIXTURES: ${{ github.workspace }}/.runtime/performance
          RUNTIME_TEST_RESULTS: ${{ github.workspace }}/.runtime/release/runtime-smoke-results.json
          RUNTIME_TEST_IMAGE: inhouse-photos-server:v${{ env.RUNTIME_VERSION }}
        run: |
          docker compose -p inhouse-runtime-test -f "$RUNTIME_TEST_COMPOSE" up -d --wait --wait-timeout 300
          node server/test/benchmarks/runtime-smoke.cjs
      - name: Package and publish the installable update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 desktop/package-server-runtime.py .runtime/release .runtime/performance/results.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('.runtime/performance/results.json').read_text())
          notes=Path('desktop/RELEASE-runtime-3.1.0-storage-saver-20261002.md').read_text()
          notes=notes.replace('3,46',f"{r['encodedBatchSpeedup']:.2f}".replace('.',',')).replace('4,42',f"{r['batchSpeedup']:.2f}".replace('.',','))
          notes=notes.replace('con cuatro núcleos',f"con {r['cpus']} núcleos")
          by_name={case['name']:case['speedup'] for case in r['results']}
          notes=notes.replace('2,58',f"{by_name['jpeg-24mp']:.2f}".replace('.',',')).replace('2,10',f"{by_name['jpeg-24mp-rotated']:.2f}".replace('.',','))
          Path('.runtime/release/RELEASE.md').write_text(notes)
          PY
          if gh release view "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft > .runtime/is-draft; then
            test "$(cat .runtime/is-draft)" = true
          else
            gh release create "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Inhouse Photos - motor $RUNTIME_VERSION" --draft --prerelease --notes-file .runtime/release/RELEASE.md
          fi
          gh release upload "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --clobber ".runtime/release/Inhouse-Photos-Server-Runtime-$RUNTIME_VERSION.zip" .runtime/release/server-runtime-update.json .runtime/release/storage-saver-performance.json .runtime/release/runtime-smoke-results.json .runtime/release/SHA256SUMS.txt
          gh release edit "$RUNTIME_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file .runtime/release/RELEASE.md --draft=false --prerelease --latest=false
      - name: Remove the isolated test containers and volumes
        if: always()
        run: docker compose -p inhouse-runtime-test -f server/test/benchmarks/runtime-smoke.compose.yml down --volumes
