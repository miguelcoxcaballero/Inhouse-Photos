<!doctype html><meta charset="utf-8"><title>Render</title><script>globalThis.IBERIA_SAMPLE_BASE = 'assets/';</script><script type="module">
import {SONGS, renderSong, substituted} from './music.js';
function wav(buf) {
  const ch = [buf.getChannelData(0), buf.getChannelData(1)], n = ch[0].length, out = new DataView(new ArrayBuffer(44 + n * 4));
  const w = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
  out.setUint32(24, buf.sampleRate, true); out.setUint32(28, buf.sampleRate * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * 4, true);
  let peak = 0; for (let i = 0; i < n; i++) for (const c of ch) peak = Math.max(peak, Math.abs(c[i]));
  const k = peak > .98 ? .98 / peak : 1;
  for (let i = 0; i < n; i++) for (let c = 0; c < 2; c++) out.setInt16(44 + i * 4 + c * 2, Math.max(-1, Math.min(1, ch[c][i] * k)) * 32767, true);
  return {blob: new Blob([out.buffer], {type: 'audio/wav'}), peak};
}
window.renderOne = async i => { const buf = await renderSong(SONGS[i]); const {blob, peak} = wav(buf); const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(blob); }); return {id: SONGS[i].id, title: SONGS[i].title, peak, b64, substituted: {...substituted}}; };
// Efectos de la interfaz: cada uno por separado (con medidas) y todos seguidos en un muestrario.
window.renderSfx = async (list, gap = .55) => {
  const {Sfx, UI_SAMPLES} = await import('./sfx.js'), {loadInstruments} = await import('./music.js');
  const sr = 44100, stats = [];
  const fake = {init() {}, ctx: null};
  const one = async ([name, opts]) => {
    const ctx = new OfflineAudioContext(2, sr * 3.2, sr), s = new Sfx(fake); s.armed = true; s.attach(ctx, ctx.destination);
    await loadInstruments(ctx, UI_SAMPLES); s.play(name, opts || {}, .02);
    const b = await ctx.startRendering(), d = b.getChannelData(0), e = b.getChannelData(1);
    let peak = 0, sum = 0, last = 0; for (let i = 0; i < d.length; i++) { const v = Math.max(Math.abs(d[i]), Math.abs(e[i])); peak = Math.max(peak, v); sum += d[i] * d[i]; if (v > .001) last = i; }
    // energía en los 300 ms más fuertes
    let best = 0, w = Math.floor(sr * .3), acc = 0; for (let i = 0; i < d.length; i++) { acc += d[i] * d[i]; if (i >= w) acc -= d[i - w] * d[i - w]; best = Math.max(best, acc); }
    stats.push({name, opts, peakDb: +(20 * Math.log10(peak + 1e-9)).toFixed(1), loudDb: +(10 * Math.log10(best / w + 1e-12)).toFixed(1), dur: +(last / sr).toFixed(2)});
    return b;
  };
  const bufs = []; for (const x of list) bufs.push(await one(x));
  const total = bufs.reduce((n, b, k) => n + Math.ceil((stats[k].dur + gap) * sr), 0), out = new OfflineAudioContext(2, total, sr).createBuffer(2, total, sr);
  let pos = 0; bufs.forEach((b, k) => { for (let c = 0; c < 2; c++) out.getChannelData(c).set(b.getChannelData(c).subarray(0, Math.min(b.length, total - pos)), pos); pos += Math.ceil((stats[k].dur + gap) * sr); });
  const {blob} = wav(out); const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
  return {stats, b64};
};
window.count = SONGS.length; window.ready = true;
</script>
